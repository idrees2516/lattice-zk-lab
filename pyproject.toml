[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lzk"
version = "0.1.0"
description = "Lattice-ZK Lab: reference implementations of lattice-based folding / PCS / sumcheck-aided argument protocols (Wave 7 + Wave 8 rebuild)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "idrees2516" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/lzk"]

[tool.coverage.report]
show_missing = true
